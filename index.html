<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Asistencia QR</title>
<meta name="theme-color" content="#0f121a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d13; --bg2:#0f121a; --elev:#171b26; --elev2:#1f2430; --elev3:#262c3a;
  --border:#2a3040; --border-soft:#1e2330;
  --text:#eef1f5; --text-dim:#8892a6; --text-faint:#586074;
  --teal:#2dd4bf; --teal-dim:#1a8f80; --teal-glow:rgba(45,212,191,.45);
  --green:#34d399; --green-glow:rgba(52,211,153,.5);
  --amber:#fbbf24; --amber-glow:rgba(251,191,36,.45);
  --red:#f87171; --red-glow:rgba(248,113,113,.45);
  --radius:20px; --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:radial-gradient(ellipse 140% 100% at 50% -10%, #141a26 0%, var(--bg) 55%);
  color:var(--text); font-family:'Inter',sans-serif;
  overflow:hidden; overscroll-behavior:none; user-select:none;
  display:flex; flex-direction:column;
}
.disp{font-family:'Space Grotesk',sans-serif}
h1,h2,h3{margin:0; font-family:'Space Grotesk',sans-serif}
button{font-family:inherit; border:none; background:none; color:inherit; cursor:pointer}
input,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--elev3);border-radius:8px}

/* ── Barra de estado de conexión ── */
#connDot{
  position:fixed; top:14px; right:16px; z-index:900;
  display:flex; align-items:center; gap:7px;
  padding:6px 12px 6px 9px; border-radius:20px; background:rgba(23,27,38,.85);
  border:1px solid var(--border-soft); backdrop-filter:blur(8px);
  font-size:.72rem; font-weight:600; color:var(--text-dim); cursor:pointer;
  transition:background .2s;
}
#connDot .dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);transition:all .3s;flex-shrink:0}
#connDot.ok .dot{background:var(--green);box-shadow:0 0 8px var(--green-glow)}
#connDot.err .dot{background:var(--red);box-shadow:0 0 8px var(--red-glow)}
#connDot.loading .dot{background:var(--amber);box-shadow:0 0 8px var(--amber-glow);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ══════════════════ PANTALLA DE INICIO ══════════════════ */
#screenHome{
  flex:1; display:flex; flex-direction:column; min-height:0;
  padding:28px clamp(20px,4vw,56px) 22px;
}
.home-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap}
.home-brand{display:flex;align-items:center;gap:14px}
.home-brand .mark{
  width:46px;height:46px;border-radius:13px;
  background:linear-gradient(135deg,var(--teal),#1aa896);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;
  box-shadow:0 6px 18px rgba(45,212,191,.25);
}
.home-brand h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.home-brand p{margin:2px 0 0;font-size:.82rem;color:var(--text-dim)}
.date-picker{
  display:flex;align-items:center;gap:10px;background:var(--elev);
  border:1px solid var(--border); border-radius:14px; padding:9px 16px;
}
.date-picker label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700}
.date-picker input[type=date]{
  background:none;border:none;color:var(--text);font-size:1rem;font-weight:600;
  font-family:'Space Grotesk',sans-serif; outline:none; color-scheme:dark;
}
.date-picker .today-btn{
  font-size:.72rem;font-weight:700;color:var(--teal);background:rgba(45,212,191,.12);
  padding:5px 10px;border-radius:8px;
}

.grado-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.grado-tab{
  padding:8px 18px;border-radius:11px;font-size:.85rem;font-weight:700;
  background:var(--elev);border:1px solid var(--border);color:var(--text-dim);
  transition:all .15s;
}
.grado-tab.active{background:var(--teal);color:#08211d;border-color:var(--teal)}

#groupGrid{
  flex:1; min-height:0; overflow-y:auto;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;
  padding-bottom:10px;
}
.group-card{
  background:var(--elev); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 18px 16px; text-align:left; position:relative; overflow:hidden;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
  display:flex; flex-direction:column; gap:10px; min-height:132px;
}
.group-card:active{transform:scale(.97)}
.group-card:hover{border-color:var(--teal-dim); background:var(--elev2)}
.group-card .badge{
  width:52px;height:52px;border-radius:13px;background:var(--elev3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem;color:var(--teal);
  flex-shrink:0;
}
.group-card .gname{font-size:1rem;font-weight:700;line-height:1.25}
.group-card .gsub{font-size:.76rem;color:var(--text-dim);margin-top:1px}
.group-card .gmeta{
  margin-top:auto; display:flex;align-items:center;justify-content:space-between;
  font-size:.72rem;color:var(--text-faint);
}
.group-card .taken{
  position:absolute; top:14px; right:14px;
  font-size:.68rem;font-weight:700;color:var(--green);
  background:rgba(52,211,153,.13); padding:3px 9px;border-radius:20px;
  display:flex;align-items:center;gap:4px;
}
#emptyGroups{margin:auto;text-align:center;color:var(--text-dim);padding:40px}
#emptyGroups .ico{font-size:2.6rem;margin-bottom:10px;opacity:.5}

/* ══════════════════ PANTALLA DE ESCANEO ══════════════════ */
#screenScan{
  position:fixed; inset:0; z-index:100; display:none;
  flex-direction:column; background:var(--bg);
}
#screenScan.active{display:flex}
.scan-top{
  display:flex; align-items:center; gap:14px;
  padding:14px 20px; border-bottom:1px solid var(--border-soft);
  background:rgba(15,18,26,.7); backdrop-filter:blur(10px); z-index:5;
}
.back-btn{
  width:40px;height:40px;border-radius:11px;background:var(--elev);
  border:1px solid var(--border); display:flex;align-items:center;justify-content:center;
  font-size:1.1rem; flex-shrink:0;
}
.back-btn:active{background:var(--elev2)}
.scan-title{flex:1; min-width:0}
.scan-title .gn{font-size:1rem;font-weight:700; white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.scan-title .gd{font-size:.72rem;color:var(--text-dim)}
.tally{display:flex;gap:8px;flex-shrink:0}
.tally-chip{
  display:flex;align-items:center;gap:5px; padding:6px 11px;border-radius:20px;
  font-size:.8rem;font-weight:700; background:var(--elev); border:1px solid var(--border);
  transition:transform .15s;
}
.tally-chip .n{font-family:'Space Grotesk',sans-serif; min-width:14px; text-align:center}
.tally-chip.bump{transform:scale(1.18)}
.tally-chip.pre{color:var(--green)}
.tally-chip.tar{color:var(--amber)}
.tally-chip.aus{color:var(--red)}
.tally-chip.sin{color:var(--text-faint)}

.scan-body{flex:1; display:flex; min-height:0}
.scan-stage{
  flex:1.3; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:22px; gap:16px; position:relative; min-width:0;
}
#camWrap{
  position:relative; width:min(66vh,560px); aspect-ratio:1/1; max-width:92%;
  border-radius:28px; overflow:hidden; background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
#camVideo{width:100%;height:100%;object-fit:cover; display:block}
#scanCanvas{display:none}
.frame-overlay{position:absolute; inset:0; pointer-events:none}
.corner{position:absolute; width:44px; height:44px; border-color:var(--teal); transition:border-color .2s, filter .2s}
.corner.tl{top:24px;left:24px;border-top:4px solid;border-left:4px solid;border-radius:14px 0 0 0}
.corner.tr{top:24px;right:24px;border-top:4px solid;border-right:4px solid;border-radius:0 14px 0 0}
.corner.bl{bottom:24px;left:24px;border-bottom:4px solid;border-left:4px solid;border-radius:0 0 0 14px}
.corner.br{bottom:24px;right:24px;border-bottom:4px solid;border-right:4px solid;border-radius:0 0 14px 0}
#camWrap.flash-ok .corner{border-color:var(--green); filter:drop-shadow(0 0 10px var(--green-glow))}
#camWrap.flash-dup .corner{border-color:var(--amber); filter:drop-shadow(0 0 10px var(--amber-glow))}
#camWrap.flash-err .corner{border-color:var(--red); filter:drop-shadow(0 0 10px var(--red-glow))}
.scan-line{
  position:absolute; left:6%; right:6%; height:3px; top:10%;
  background:linear-gradient(90deg,transparent,var(--teal),transparent);
  box-shadow:0 0 14px 2px var(--teal-glow); border-radius:4px;
  animation:scanmove 2.2s ease-in-out infinite;
}
@keyframes scanmove{0%,100%{top:10%}50%{top:88%}}
#camHint{font-size:.85rem;color:var(--text-dim); text-align:center}
.cam-controls{display:flex;gap:10px}
.cam-btn{
  padding:11px 22px;border-radius:12px;font-size:.85rem;font-weight:700;
  background:var(--elev);border:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.cam-btn.primary{background:var(--teal); color:#08211d; border-color:var(--teal)}
.cam-btn:active{transform:scale(.96)}

#lastCard{
  width:min(66vh,560px); max-width:92%; border-radius:16px; padding:14px 18px;
  background:var(--elev); border:1px solid var(--border);
  display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(10px);
  transition:all .25s ease; min-height:64px;
}
#lastCard.show{opacity:1; transform:translateY(0)}
#lastCard .ic{font-size:1.7rem; flex-shrink:0}
#lastCard .nm{font-weight:700; font-size:.98rem; line-height:1.3}
#lastCard .dt{font-size:.76rem; color:var(--text-dim); margin-top:1px}

.roster-panel{
  flex:1; max-width:380px; border-left:1px solid var(--border-soft);
  display:flex; flex-direction:column; min-height:0; background:rgba(23,27,38,.4);
}
.roster-head{
  padding:16px 18px 10px; display:flex; align-items:center; justify-content:space-between;
}
.roster-head h3{font-size:.9rem}
.roster-head .count{font-size:.72rem; color:var(--text-dim)}
#rosterSearch{
  margin:0 18px 10px; padding:9px 12px; border-radius:10px;
  background:var(--elev); border:1px solid var(--border); color:var(--text); font-size:.82rem;
  outline:none; width:calc(100% - 36px);
}
#rosterSearch:focus{border-color:var(--teal-dim)}
#rosterList{flex:1; overflow-y:auto; padding:0 10px 14px}
.roster-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:12px;
  transition:background .15s;
}
.roster-row.just-marked{animation:rowFlash 1.4s ease}
@keyframes rowFlash{0%,55%{background:rgba(52,211,153,.16)}100%{background:transparent}}
.roster-row .rn{
  flex:1; min-width:0; font-size:.84rem; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.roster-row .rg{font-size:.68rem; color:var(--text-faint); font-weight:700}
.roster-actions{display:flex; gap:5px; flex-shrink:0}
.rbtn{
  width:30px;height:30px;border-radius:9px; background:var(--elev2); border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center; font-size:.85rem; color:var(--text-faint);
}
.rbtn.on-pre{background:var(--green); color:#08211d; border-color:var(--green)}
.rbtn.on-tar{background:var(--amber); color:#3a2900; border-color:var(--amber)}
.rbtn.on-aus{background:var(--red); color:#3a0d0d; border-color:var(--red)}

/* ── Confeti simple al 100% ── */
#confettiLayer{position:fixed; inset:0; pointer-events:none; z-index:300; overflow:hidden}
.confetti-piece{position:absolute; top:-14px; border-radius:2px; opacity:.9}

/* ── Prompt de motivo (tardanza) ── */
.overlay{
  position:fixed; inset:0; background:rgba(6,8,12,.7); backdrop-filter:blur(3px);
  z-index:400; display:none; align-items:center; justify-content:center; padding:20px;
}
.overlay.show{display:flex}
.modal-card{
  background:var(--elev); border:1px solid var(--border); border-radius:18px;
  padding:24px 26px; width:380px; max-width:100%;
}
.modal-card h3{font-size:1.05rem; margin-bottom:14px}
.modal-card input[type=text]{
  width:100%; padding:11px 14px; border-radius:11px; background:var(--elev2);
  border:1px solid var(--border); color:var(--text); font-size:.92rem; outline:none; margin-bottom:16px;
}
.modal-card input[type=text]:focus{border-color:var(--teal-dim)}
.modal-actions{display:flex; justify-content:flex-end; gap:9px}
.mbtn{padding:9px 18px; border-radius:10px; font-size:.85rem; font-weight:700; background:var(--elev2); border:1px solid var(--border)}
.mbtn.primary{background:var(--amber); color:#3a2900; border-color:var(--amber)}

@media (max-width:820px){
  .scan-body{flex-direction:column}
  .roster-panel{max-width:none; border-left:none; border-top:1px solid var(--border-soft)}
  #camWrap{width:min(58vh,420px)}
}
</style>
</head>
<body>

<div id="connDot" class="loading" onclick="toggleConnPanel()">
  <span class="dot"></span><span id="connText">Conectando…</span>
</div>

<!-- ═══════════ PANTALLA DE INICIO ═══════════ -->
<div id="screenHome">
  <div class="home-head">
    <div class="home-brand">
      <div class="mark">✅</div>
      <div>
        <h1>Asistencia QR</h1>
        <p>Vinculada a Registro de Calificaciones · toca un grupo para pasar lista</p>
      </div>
    </div>
    <div class="date-picker">
      <label>Fecha</label>
      <input type="date" id="homeDate" onchange="onDateChange()">
      <button class="today-btn" onclick="setToday()">Hoy</button>
    </div>
  </div>

  <div class="grado-tabs" id="gradoTabs"></div>
  <div id="groupGrid"></div>
</div>

<!-- ═══════════ PANTALLA DE ESCANEO ═══════════ -->
<div id="screenScan">
  <div class="scan-top">
    <button class="back-btn" onclick="volverInicio()">←</button>
    <div class="scan-title">
      <div class="gn" id="scanGroupName">—</div>
      <div class="gd" id="scanDate">—</div>
    </div>
    <div class="tally">
      <div class="tally-chip pre"><span>✅</span><span class="n" id="tPre">0</span></div>
      <div class="tally-chip tar"><span>⏰</span><span class="n" id="tTar">0</span></div>
      <div class="tally-chip aus"><span>❌</span><span class="n" id="tAus">0</span></div>
      <div class="tally-chip sin"><span>—</span><span class="n" id="tSin">0</span></div>
    </div>
  </div>

  <div class="scan-body">
    <div class="scan-stage">
      <div id="camWrap">
        <video id="camVideo" autoplay playsinline muted></video>
        <canvas id="scanCanvas"></canvas>
        <div class="frame-overlay">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <div class="scan-line" id="scanLine" style="display:none"></div>
        </div>
      </div>
      <div id="camHint">Apunta la cámara al código QR del alumno</div>
      <div class="cam-controls">
        <button class="cam-btn primary" id="btnStartCam" onclick="iniciarCamara()">▶ Iniciar cámara</button>
        <button class="cam-btn" id="btnStopCam" style="display:none" onclick="detenerCamara()">⏹ Detener</button>
      </div>
      <div id="lastCard"><div class="ic" id="lastIc">—</div><div><div class="nm" id="lastNm">—</div><div class="dt" id="lastDt">—</div></div></div>
    </div>

    <div class="roster-panel">
      <div class="roster-head"><h3>📋 Lista manual</h3><span class="count" id="rosterCount">0 alumnos</span></div>
      <input type="text" id="rosterSearch" placeholder="Buscar alumno…" oninput="renderRoster()">
      <div id="rosterList"></div>
    </div>
  </div>
</div>

<div id="confettiLayer"></div>

<div class="overlay" id="motivoOverlay">
  <div class="modal-card">
    <h3>⏰ Motivo de la tardanza</h3>
    <input type="text" id="motivoInput" placeholder="Ej. Transporte, tráfico…" autocomplete="off">
    <div class="modal-actions">
      <button class="mbtn" onclick="cerrarMotivo()">Cancelar</button>
      <button class="mbtn primary" onclick="confirmarMotivo()">Guardar tardanza</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   ASISTENCIA QR — app dedicada para tablet, vinculada a la misma
   Firebase Realtime Database que "Registro de Calificaciones".
   Solo LEE calificaciones/data/groups y ESCRIBE de forma puntual en
   calificaciones/data/asistencia/{grupoId}_{fecha}/{alumnoId} — nunca
   toca el resto del documento, para no chocar con la app principal.
   ════════════════════════════════════════════════════════════════════ */

const FB_CONFIG = {
  apiKey: "AIzaSyCkgxH-6KUE0v1I0xzvVTuj1VP9Pw4bwWA",
  authDomain: "registro-de-calificacion-42ca0.firebaseapp.com",
  databaseURL: "https://registro-de-calificacion-42ca0-default-rtdb.firebaseio.com",
  projectId: "registro-de-calificacion-42ca0",
  storageBucket: "registro-de-calificacion-42ca0.firebasestorage.app",
  messagingSenderId: "791739764579",
  appId: "1:791739764579:web:7b04d2b07a9775712c8d56"
};
const DATA_PATH = 'calificaciones/data';

let db = null;
let groups = [];          // arreglo de grupos leídos de Firebase (solo lectura)
let asistencia = {};       // nodo completo de asistencia (solo lectura, en vivo)
let qrIndex = {};          // codigoQR normalizado -> {student, group}
let state = {
  fecha: hoyISO(),
  gradoFiltro: 'todos',
  grupoActualId: null,
  camActiva: false,
  useBD: false,
  scanAnim: null,
  scanStream: null,
  lastScanText: '',
  lastScanAt: 0,
  motivoParaSid: null,
};

function hoyISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function escHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim(); }

/* ══════════════════ CONEXIÓN FIREBASE ══════════════════ */
function setConn(state_, text){
  const el = document.getElementById('connDot');
  el.className = state_;
  document.getElementById('connText').textContent = text;
}
function toggleConnPanel(){
  const el = document.getElementById('connDot');
  const cur = el.className;
  setConn(cur, cur==='ok' ? '🟢 Conectado en vivo' : cur==='err' ? '🔴 Sin conexión — reintentando…' : 'Conectando…');
  setTimeout(()=>{ if(cur==='ok') setConn('ok','En vivo'); }, 2200);
}

function initFirebase(){
  const s1 = document.createElement('script');
  s1.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js';
  s1.onload = () => {
    const s2 = document.createElement('script');
    s2.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js';
    s2.onload = () => {
      const s3 = document.createElement('script');
      s3.src = 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js';
      s3.onload = () => {
        firebase.initializeApp(FB_CONFIG);
        const auth = firebase.auth();
        let yaConectado = false;
        // Igual que en Registro de Calificaciones: las reglas de la base de
        // datos requieren "auth != null", así que iniciamos sesión anónima
        // (sin pedir usuario/contraseña) y esperamos a onAuthStateChanged
        // antes de leer/escribir — conectar antes de eso puede dar
        // PERMISSION_DENIED de forma intermitente.
        auth.onAuthStateChanged(user => {
          if (user && !yaConectado){
            yaConectado = true;
            db = firebase.database();
            escucharGrupos();
            escucharAsistencia();
            db.ref('.info/connected').on('value', snap => {
              setConn(snap.val() ? 'ok' : 'err', snap.val() ? 'En vivo' : 'Sin conexión');
            });
          }
        });
        auth.signInAnonymously().catch(e => {
          console.error('[Auth] fallo anónimo:', e.code, e.message);
          setConn('err', 'Sin permiso: ' + e.code);
        });
      };
      s3.onerror = () => setConn('err','No se pudo cargar Firebase Auth');
      document.head.appendChild(s3);
    };
    s2.onerror = () => setConn('err','No se pudo cargar Firebase');
    document.head.appendChild(s2);
  };
  s1.onerror = () => setConn('err','Sin internet');
  document.head.appendChild(s1);
}

function escucharGrupos(){
  db.ref(DATA_PATH + '/groups').on('value', snap => {
    const val = snap.val();
    let lista = Array.isArray(val) ? val.filter(Boolean) : Object.values(val || {});
    lista.forEach(g => { g.students = Array.isArray(g.students) ? g.students.filter(Boolean) : Object.values(g.students || {}); });
    groups = dedupGrupos(lista);
    reindexarQR();
    renderGradoTabs();
    renderGroupGrid();
    if (state.grupoActualId) { renderScanTop(); renderRoster(); }
  });
}

// Registro de Calificaciones guarda un grupo por cada trimestre (mismo
// nombre, distinto id) — normalmente solo uno tiene alumnos capturados.
// Para la tarjeta nos quedamos con el que tenga más alumnos (el que
// realmente está en uso), pero guardamos TODOS los ids hermanos en
// _idsHermanos: la asistencia se escribe en todos ellos, para que se vea
// sin importar cuál trimestre tenga seleccionado la app principal en ese
// momento (ahí es donde realmente busca los registros de hoy).
function dedupGrupos(lista){
  const porNombre = {};
  lista.forEach(g => {
    const key = norm(g.name) + '|' + norm(g.subject||'');
    if (!porNombre[key]) porNombre[key] = [];
    porNombre[key].push(g);
  });
  return Object.values(porNombre).map(variantes => {
    const ganador = variantes.slice().sort((a,b)=>(b.students||[]).length-(a.students||[]).length)[0];
    ganador._idsHermanos = variantes.map(v=>v.id);
    return ganador;
  });
}

function escucharAsistencia(){
  db.ref(DATA_PATH + '/asistencia').on('value', snap => {
    asistencia = snap.val() || {};
    renderGroupGrid();
    if (state.grupoActualId) { renderTally(); renderRoster(); }
  });
}

function reindexarQR(){
  qrIndex = {};
  groups.forEach(g => (g.students||[]).forEach(s => {
    if (s && !s.inactive && s.qrCode) qrIndex[norm(s.qrCode)] = { student: s, group: g };
  }));
}

/* ══════════════════ HELPERS DE GRUPO / GRADO ══════════════════ */
function gradoDeGrupo(g){
  const n = String(g.name||'').toUpperCase();
  if (n.includes('PRIMERO') || /(^|\s)1[°º]?(\s|$)/.test(n)) return '1';
  if (n.includes('SEGUNDO') || /(^|\s)2[°º]?(\s|$)/.test(n)) return '2';
  if (n.includes('TERCERO') || /(^|\s)3[°º]?(\s|$)/.test(n)) return '3';
  if (n.includes('CUARTO')  || /(^|\s)4[°º]?(\s|$)/.test(n)) return '4';
  if (n.includes('QUINTO')  || /(^|\s)5[°º]?(\s|$)/.test(n)) return '5';
  if (n.includes('SEXTO')   || /(^|\s)6[°º]?(\s|$)/.test(n)) return '6';
  return '?';
}
function letraDeGrupo(g){
  // Captura el bloque de letras después del grado, sea una sola (ej. "1°A",
  // "PRIMERO C") o varias juntas de un grupo combinado (ej. "PRIMERO ABC").
  const n = String(g.name||'').toUpperCase();
  const m = n.match(/(?:PRIMERO|SEGUNDO|TERCERO|CUARTO|QUINTO|SEXTO|[1-6][°º]?)\s*([A-I]{1,6})\b/);
  return m ? m[1] : '';
}
function idsDeGrupo(g){ return (g && g._idsHermanos && g._idsHermanos.length) ? g._idsHermanos : [g.id]; }
function asistKey(gid, fecha){ return gid + '_' + fecha; }
// Combina (fusiona) los registros de asistencia de TODOS los ids hermanos
// de un grupo para una fecha — así se ve lo marcado sin importar bajo
// cuál id (trimestre) haya quedado guardado.
function registroDe(g, fecha){
  const rec = {};
  idsDeGrupo(g).forEach(gid => Object.assign(rec, asistencia[asistKey(gid, fecha)] || {}));
  return rec;
}

/* ══════════════════ PANTALLA DE INICIO ══════════════════ */
function setToday(){ state.fecha = hoyISO(); document.getElementById('homeDate').value = state.fecha; renderGroupGrid(); }
function onDateChange(){ state.fecha = document.getElementById('homeDate').value || hoyISO(); renderGroupGrid(); }

function renderGradoTabs(){
  const grados = [...new Set(groups.map(gradoDeGrupo))].sort();
  const wrap = document.getElementById('gradoTabs');
  const tabs = ['todos', ...grados];
  wrap.innerHTML = tabs.map(t => `<button class="grado-tab ${state.gradoFiltro===t?'active':''}" onclick="filtrarGrado('${t}')">${t==='todos'?'Todos':t+'°'}</button>`).join('');
}
function filtrarGrado(g){ state.gradoFiltro = g; renderGradoTabs(); renderGroupGrid(); }

function renderGroupGrid(){
  const grid = document.getElementById('groupGrid');
  let lista = groups.slice();
  if (state.gradoFiltro !== 'todos') lista = lista.filter(g => gradoDeGrupo(g) === state.gradoFiltro);
  lista.sort((a,b) => (gradoDeGrupo(a)+letraDeGrupo(a)+a.name).localeCompare(gradoDeGrupo(b)+letraDeGrupo(b)+b.name,'es'));

  if (!lista.length){
    grid.innerHTML = '';
    grid.insertAdjacentHTML('beforeend', `<div id="emptyGroups"><div class="ico">🗂️</div>${groups.length?'No hay grupos en este grado':'Esperando datos de Registro de Calificaciones…'}</div>`);
    return;
  }
  grid.innerHTML = lista.map(g => {
    const activos = (g.students||[]).filter(s=>!s.inactive).length;
    const rec = registroDe(g, state.fecha);
    const tomada = Object.keys(rec).filter(k=>!k.includes('_motivo')).length > 0;
    const grado = gradoDeGrupo(g), letra = letraDeGrupo(g);
    return `<button class="group-card" onclick="abrirGrupo('${g.id}')">
      ${tomada ? '<span class="taken">✓ Ya iniciada</span>' : ''}
      <div class="badge">${grado!=='?'?grado+'°':'—'}${letra}</div>
      <div><div class="gname">${escHtml(g.name)}</div><div class="gsub">${escHtml(g.subject||'')}</div></div>
      <div class="gmeta"><span>${activos} alumno${activos!==1?'s':''}</span></div>
    </button>`;
  }).join('');
}

/* ══════════════════ ABRIR / CERRAR GRUPO ══════════════════ */
function abrirGrupo(gid){
  state.grupoActualId = gid;
  document.getElementById('screenScan').classList.add('active');
  renderScanTop(); renderTally(); renderRoster();
  document.getElementById('lastCard').classList.remove('show');
  setTimeout(iniciarCamara, 200);
}
function volverInicio(){
  detenerCamara();
  state.grupoActualId = null;
  document.getElementById('screenScan').classList.remove('active');
  renderGroupGrid();
}
function grupoActual(){ return groups.find(g => g.id === state.grupoActualId); }

function renderScanTop(){
  const g = grupoActual(); if(!g) return;
  const d = new Date(state.fecha+'T12:00');
  const fechaTxt = d.toLocaleDateString('es-MX',{weekday:'long',day:'2-digit',month:'long'});
  document.getElementById('scanGroupName').textContent = g.name;
  document.getElementById('scanDate').textContent = fechaTxt.charAt(0).toUpperCase()+fechaTxt.slice(1);
}

function renderTally(){
  const g = grupoActual(); if(!g) return;
  const rec = registroDe(g, state.fecha);
  const activos = (g.students||[]).filter(s=>!s.inactive);
  let pre=0,tar=0,aus=0;
  activos.forEach(s => { const st=rec[s.id]; if(st==='presente')pre++; else if(st==='tarde')tar++; else if(st==='ausente')aus++; });
  const sin = activos.length - pre - tar - aus;
  bumpTally('tPre',pre); bumpTally('tTar',tar); bumpTally('tAus',aus); bumpTally('tSin',sin);
  if (sin===0 && aus===0 && activos.length>0) lanzarConfetti();
}
function bumpTally(id, val){
  const el = document.getElementById(id);
  if (el.textContent !== String(val)){
    el.textContent = val;
    el.parentElement.classList.add('bump');
    setTimeout(()=>el.parentElement.classList.remove('bump'), 220);
  }
}

/* ══════════════════ LISTA MANUAL ══════════════════ */
function renderRoster(){
  const g = grupoActual(); if(!g) return;
  const rec = registroDe(g, state.fecha);
  const q = norm(document.getElementById('rosterSearch').value);
  let activos = (g.students||[]).filter(s=>!s.inactive);
  document.getElementById('rosterCount').textContent = activos.length + ' alumno' + (activos.length!==1?'s':'');
  if (q) activos = activos.filter(s => norm(s.name).includes(q));
  activos.sort((a,b)=>a.name.localeCompare(b.name,'es'));

  document.getElementById('rosterList').innerHTML = activos.map(s => {
    const st = rec[s.id] || '';
    return `<div class="roster-row" id="rrow_${s.id}">
      <div class="rn">${escHtml(s.name)}</div>
      <div class="roster-actions">
        <button class="rbtn ${st==='presente'?'on-pre':''}" onclick="marcarManual('${s.id}','presente')" title="Presente">✅</button>
        <button class="rbtn ${st==='tarde'?'on-tar':''}" onclick="pedirMotivo('${s.id}')" title="Tarde">⏰</button>
        <button class="rbtn ${st==='ausente'?'on-aus':''}" onclick="marcarManual('${s.id}','ausente')" title="Ausente">❌</button>
      </div>
    </div>`;
  }).join('') || `<div style="padding:30px;text-align:center;color:var(--text-faint);font-size:.82rem">Sin resultados</div>`;
}

function marcarManual(sid, estado, motivo){
  const g = grupoActual(); if(!g) return;
  const updates = { [sid]: estado };
  // Se escribe en TODOS los ids hermanos (mismo salón, distinto trimestre)
  // para que se vea sin importar cuál tenga seleccionado la app principal.
  idsDeGrupo(g).forEach(gid => {
    const ref = db.ref(DATA_PATH + '/asistencia/' + asistKey(gid, state.fecha));
    ref.update(updates);
    if (estado === 'tarde' && motivo) ref.child(sid + '_motivo').set(motivo);
    else if (estado !== 'tarde') ref.child(sid + '_motivo').remove();
  });
  marcarActividadReciente();

  const row = document.getElementById('rrow_' + sid);
  if (row){ row.classList.remove('just-marked'); void row.offsetWidth; row.classList.add('just-marked'); }
  const s = (g.students||[]).find(x=>x.id===sid);
  sonido(estado==='ausente' ? 'dup' : 'ok');
  mostrarUltimo(s, estado, motivo);
}
// Registro de Calificaciones solo aplica los cambios que le llegan de
// Firebase si traen una marca de tiempo (_savedAt) más nueva que la que ya
// tiene guardada localmente — es su protección contra pisar datos más
// recientes. Como esta app nunca la actualizaba, la app principal siempre
// creía que "ya tenía eso" y descartaba nuestros cambios sin aplicarlos.
// Por eso, junto con cada asistencia, también actualizamos esa marca (y
// quién la hizo) — solo esos dos campos, sin tocar groups/asistencia.
function marcarActividadReciente(){
  if (!db) return;
  db.ref(DATA_PATH).update({ _savedAt: Date.now(), _savedBy: 'tablet_asistencia_qr' }).catch(()=>{});
}
function pedirMotivo(sid){
  state.motivoParaSid = sid;
  document.getElementById('motivoInput').value = '';
  document.getElementById('motivoOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('motivoInput').focus(), 80);
}
function cerrarMotivo(){ document.getElementById('motivoOverlay').classList.remove('show'); state.motivoParaSid = null; }
function confirmarMotivo(){
  const sid = state.motivoParaSid;
  const motivo = document.getElementById('motivoInput').value.trim();
  cerrarMotivo();
  if (sid) marcarManual(sid, 'tarde', motivo);
}

function mostrarUltimo(s, estado, motivo){
  const card = document.getElementById('lastCard');
  const iconos = {presente:'✅', tarde:'⏰', ausente:'❌'};
  const textos = {presente:'Presente', tarde:'Tardanza'+(motivo?' — '+motivo:''), ausente:'Ausente'};
  document.getElementById('lastIc').textContent = iconos[estado]||'—';
  document.getElementById('lastNm').textContent = s ? s.name : '—';
  document.getElementById('lastDt').textContent = textos[estado]||'';
  card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
}

/* ══════════════════ CÁMARA + ESCANEO QR ══════════════════ */
function iniciarCamara(){
  if (state.camActiva) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    document.getElementById('camHint').textContent = '⚠️ Este navegador no permite usar la cámara aquí (¿estás en HTTPS?)';
    return;
  }
  document.getElementById('camHint').textContent = 'Solicitando permiso de cámara…';
  // Primer intento: cámara trasera, sin forzar resolución (en tablets viejas,
  // pedir una resolución exacta suele hacer fallar el acceso a la cámara).
  // Si falla, se intenta de nuevo sin pedir cámara trasera específicamente,
  // por si el dispositivo no reporta bien sus cámaras.
  _probarCamara({ video: { facingMode: { ideal: 'environment' } } })
    .catch(() => _probarCamara({ video: true }))
    .catch(mostrarErrorCamara);
}
function _probarCamara(constraints){
  return navigator.mediaDevices.getUserMedia(constraints).then(stream => {
    state.scanStream = stream;
    const v = document.getElementById('camVideo');
    v.srcObject = stream;
    state.camActiva = true;
    document.getElementById('btnStartCam').style.display = 'none';
    document.getElementById('btnStopCam').style.display = 'flex';
    document.getElementById('scanLine').style.display = 'block';
    document.getElementById('camHint').textContent = 'Buscando código…';
    cargarDecoder(() => loopEscaneo());
  });
}
function mostrarErrorCamara(err){
  console.error('[Camara] getUserMedia falló:', err);
  const nombres = {
    NotAllowedError: 'Permiso de cámara denegado. Ábrelo en los ajustes del sitio (icono de candado) y actívalo.',
    PermissionDeniedError: 'Permiso de cámara denegado. Ábrelo en los ajustes del sitio (icono de candado) y actívalo.',
    NotFoundError: 'No se encontró ninguna cámara en este dispositivo.',
    NotReadableError: 'La cámara está siendo usada por otra app. Ciérrala e inténtalo de nuevo.',
    OverconstrainedError: 'La cámara no soporta la configuración solicitada.',
    SecurityError: 'Bloqueado por seguridad — confirma que la página abre con https://',
    AbortError: 'Se canceló el acceso a la cámara.',
  };
  const nombre = err && err.name;
  const texto = nombres[nombre] || ('Error de cámara' + (nombre ? ': ' + nombre : '') + (err && err.message ? ' — ' + err.message : ''));
  document.getElementById('camHint').textContent = '⚠️ ' + texto;
}
function detenerCamara(){
  if (state.scanAnim) cancelAnimationFrame(state.scanAnim);
  if (state.scanStream) state.scanStream.getTracks().forEach(t=>t.stop());
  state.camActiva = false; state.scanStream = null;
  document.getElementById('btnStartCam').style.display = 'flex';
  document.getElementById('btnStopCam').style.display = 'none';
  document.getElementById('scanLine').style.display = 'none';
}
function cargarDecoder(cb){
  if (window.BarcodeDetector){ state.useBD = true; cb(); return; }
  if (window.jsQR){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
  s.onload = cb;
  s.onerror = () => { document.getElementById('camHint').textContent = '⚠️ No se pudo cargar el lector de QR'; };
  document.head.appendChild(s);
}
function loopEscaneo(){
  if (!state.camActiva) return;
  const v = document.getElementById('camVideo');
  if (state.useBD && window.BarcodeDetector && v.readyState === v.HAVE_ENOUGH_DATA){
    new BarcodeDetector({formats:['qr_code']}).detect(v)
      .then(codes => { if (codes.length) onCodigoDetectado(codes[0].rawValue); })
      .catch(()=>{});
    state.scanAnim = requestAnimationFrame(loopEscaneo);
    return;
  }
  const c = document.getElementById('scanCanvas');
  if (!window.jsQR || v.readyState !== v.HAVE_ENOUGH_DATA){ state.scanAnim = requestAnimationFrame(loopEscaneo); return; }
  const w = v.videoWidth, h = v.videoHeight;
  if (w && h){
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(v, 0, 0, w, h);
    const code = window.jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'dontInvert'});
    if (code && code.data) onCodigoDetectado(code.data);
  }
  state.scanAnim = requestAnimationFrame(loopEscaneo);
}

function onCodigoDetectado(texto){
  const ahora = Date.now();
  if (texto === state.lastScanText && (ahora - state.lastScanAt) < 2200) return; // evita relecturas del mismo código
  state.lastScanText = texto; state.lastScanAt = ahora;

  const g = grupoActual(); if(!g) return;
  const entry = qrIndex[norm(texto)];

  if (!entry){
    flashCam('err'); sonido('err'); if(navigator.vibrate) navigator.vibrate(120);
    document.getElementById('lastIc').textContent = '❓';
    document.getElementById('lastNm').textContent = 'Código no reconocido';
    document.getElementById('lastDt').textContent = texto.slice(0,40);
    const card = document.getElementById('lastCard'); card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
    return;
  }

  if (entry.group.id !== g.id){
    flashCam('dup'); sonido('dup'); if(navigator.vibrate) navigator.vibrate(60);
    document.getElementById('lastIc').textContent = '↪️';
    document.getElementById('lastNm').textContent = entry.student.name;
    document.getElementById('lastDt').textContent = 'Pertenece a ' + entry.group.name + ', no a este grupo';
    const card = document.getElementById('lastCard'); card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
    return;
  }

  const rec = registroDe(g, state.fecha);
  if (rec[entry.student.id]){
    flashCam('dup'); sonido('dup'); if(navigator.vibrate) navigator.vibrate(60);
    const estados = {presente:'Ya registrado — Presente ✅', tarde:'Ya registrado — Tardanza ⏰', ausente:'Ya registrado — Ausente ❌'};
    document.getElementById('lastIc').textContent = 'ℹ️';
    document.getElementById('lastNm').textContent = entry.student.name;
    document.getElementById('lastDt').textContent = estados[rec[entry.student.id]] || 'Ya registrado';
    const card = document.getElementById('lastCard'); card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
    return;
  }

  flashCam('ok'); sonido('ok'); if(navigator.vibrate) navigator.vibrate([30,40,30]);
  marcarManual(entry.student.id, 'presente');
}

function flashCam(tipo){
  const wrap = document.getElementById('camWrap');
  wrap.classList.remove('flash-ok','flash-dup','flash-err');
  void wrap.offsetWidth;
  wrap.classList.add('flash-' + tipo);
  setTimeout(()=>wrap.classList.remove('flash-'+tipo), 550);
}

/* ══════════════════ SONIDOS (Web Audio, sin archivos externos) ══════════════════ */
let actx = null;
function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tono(freq, inicio, dur, tipo='sine', vol=.18){
  const ctx = ac();
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = tipo; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime+inicio);
  gain.gain.linearRampToValueAtTime(vol, ctx.currentTime+inicio+.012);
  gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+inicio+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime+inicio); osc.stop(ctx.currentTime+inicio+dur+.02);
}
function sonido(tipo){
  try{
    if (tipo==='ok'){ tono(880,0,.11,'sine'); tono(1318,.09,.16,'sine'); }
    else if (tipo==='dup'){ tono(600,0,.13,'triangle',.14); }
    else if (tipo==='err'){ tono(220,0,.09,'sawtooth',.13); tono(180,.1,.12,'sawtooth',.13); }
  }catch(e){}
}

/* ══════════════════ CONFETI (100% de asistencia) ══════════════════ */
let confettiCooldown = 0;
function lanzarConfetti(){
  const ahora = Date.now();
  if (ahora - confettiCooldown < 15000) return;
  confettiCooldown = ahora;
  const layer = document.getElementById('confettiLayer');
  const colores = ['#2dd4bf','#34d399','#fbbf24','#f87171','#eef1f5'];
  for (let i=0;i<36;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    p.style.width = size+'px'; p.style.height = (size*.5)+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colores[i % colores.length];
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    const dur = 1.8 + Math.random()*1.4;
    p.animate([
      { transform:`translateY(0) rotate(0deg)`, opacity:1 },
      { transform:`translateY(${100+Math.random()*10}vh) rotate(${360+Math.random()*360}deg)`, opacity:0 }
    ], { duration: dur*1000, easing:'cubic-bezier(.25,.46,.45,.94)' });
    layer.appendChild(p);
    setTimeout(()=>p.remove(), dur*1000+100);
  }
}

/* ══════════════════ ARRANQUE ══════════════════ */
document.getElementById('homeDate').value = state.fecha;
renderGradoTabs();
renderGroupGrid();
initFirebase();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.camActiva) detenerCamara();
});
</script>
